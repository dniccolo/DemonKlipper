#
# This file is for a modified Ender 3v2 with Sprite Pro Extruder,
# CR Touch, with a 4.2.7 silent board. Klipper and Mainsail are
# installed on a Raspberry Pi 3B+ 4GB and Raspberry Pi 4B+ 4GB. 

# This configuration uses KAMP.

# Klipper Adaptive Meshing and Purge Line files are included.
# Add those to the folder you are running Klipper from.
# MORE INFO ON KAMP GITHUB
# https://github.com/kyleisah/Klipper-Adaptive-Meshing-Purging
# This file contains pin mappings for the Creality "v4.2.7" board. To
# use this config, during "make menuconfig" select the STM32F103 with
# a "28KiB bootloader" and serial (on USART1 PA10/PA9) communication.

# If you prefer a direct serial connection, in "make menuconfig"
# select "Enable extra low-level configuration options" and select
# serial (on USART3 PB11/PB10), which is broken out on the 10 pin IDC
# cable used for the LCD module as follows:
# 3: Tx, 4: Rx, 9: GND, 10: VCC

# Flash this firmware by copying "out/klipper.bin" to a SD card and
# turning on the printer with the card inserted. The firmware
# filename must end in ".bin" and must not match the last filename
# that was flashed.

# Replace the slicer's custom start and end g-code scripts with
# START_PRINT BED_TEMP={material_bed_temperature_layer_0} EXTRUDER_TEMP={material_print_temperature_layer_0} 
# and END_PRINT.

# Printer config created by Lee Otts of Lotsof3D.com

# [output_pin PRINTER_AUTO_OFF]
# pin: PB0 <<<<<< Insert unused board pin for state change only, monitored by system
# [include ./btt_eddy.cfg]
[include ./Demon_Klipper_Essentials_Unified/*.cfg]
[include ./Demon_User_Files/*.cfg]
[include ./Demon_Klipper_Essentials_Unified/Other_Files/Demon_User_Files_Updater/Demon_User_Files_Handler_v*.cfg]
[include ./Demon_BTT_Eddy_Offset.cfg]
[include ./KAMP_LiTE/*.cfg]
[include ./Heat_Soak.cfg]
[include ./btt_sfs.cfg]
[include ./lcd.cfg]
[include ./better_auto_speed.cfg]
#[include btt_adxl345_v2.0.cfg]
[include moongate.cfg]
[include timelapse.cfg]


#====================================================================
# INCLUDE MAINSAIL
#====================================================================

[include mainsail.cfg]

#====================================================================
# INCLUDE MACROS
#====================================================================

[include My_Macros.cfg]

#====================================================================
# INCLUDE TIMELAPSE
#====================================================================

# [include timelapse.cfg]

[save_variables]
filename = ~/demon_vars.cfg

[force_move]
enable_force_move: True

[idle_timeout]
gcode:
    _DEMON_IDLE_TIMEOUT
timeout: 3600

[firmware_retraction]
retract_length: 0.8
retract_speed: 35
unretract_extra_length: 0.0
unretract_speed: 35
#====================================================================
# VIRTUAL SD CARD
#====================================================================

[virtual_sdcard]
path: ~/printer_data/gcodes


#  *** IMPORTANT ***
# You will also need to ensure the following is defined in moonraker.conf
#
# [file_manager]
#enable_object_processing: True

#====================================================================
# EXCLUDE OBJECTS
#====================================================================

# The [exclude_object] module allows Klipper to exclude objects
# while a print is in progress. 

[exclude_object]

#====================================================================
# MCU
#====================================================================

[mcu]
serial: /dev/ttyUSB0 # /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
restart_method: command

[mcu RPi]
serial: /tmp/klipper_host_mcu

#====================================================================
# Raspberry Pi Temperature Display for Mainsail
#====================================================================

[temperature_sensor RPi]
sensor_type: temperature_host
min_temp: 10
max_temp: 100

[temperature_sensor mcu_temp]
sensor_type: temperature_mcu
min_temp: 0
max_temp: 100

#====================================================================
# PRINTER
#====================================================================

[printer]
kinematics: cartesian
#max_velocity: 600
#max_accel: 5000
# max_accel_to_decel: 3000
max_z_velocity: 15
max_z_accel: 500
square_corner_velocity: 5

#====================================================================
# STEPPER X
#====================================================================

[stepper_x]
step_pin: PB9
dir_pin: PC2
enable_pin: !PC3
microsteps: 16
rotation_distance: 40
endstop_pin: ^PA5
position_endstop: -7
position_max: 230
position_min: -7
homing_speed: 50

#====================================================================
# STEPPER Y
#====================================================================

[stepper_y]
step_pin: PB7
dir_pin: PB8
enable_pin: !PC3
microsteps: 16
rotation_distance: 40
endstop_pin: ^PA6
position_endstop: -2
position_max: 230
position_min: -2
homing_speed: 50

#====================================================================
# STEPPER Z
#====================================================================

[stepper_z]
step_pin: PB5
dir_pin: !PB6
enable_pin: !PC3
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
position_max: 262
position_min: -2
homing_speed: 4
second_homing_speed: 1
homing_retract_dist: 2.0

#====================================================================
# FANS
#====================================================================

[fan]
pin: PA0

#====================================================================
# EXTRUDER
#====================================================================

[extruder]
max_extrude_only_distance: 100.0 # for rotation_distance calibration. Default is 50
step_pin: PB3
dir_pin: PB4
enable_pin: !PC3
microsteps: 16
gear_ratio: 3.5:1
rotation_distance: 28.3559564
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PA1
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC5
#control: pid
#pid_Kp: 18.143
#pid_Ki: 1.404
#pid_Kd: 58.624
min_temp: 0
max_temp: 300 # Set to 300 for Sprite Pro Extruder
min_extrude_temp: 180
max_extrude_cross_section: 5 # For KAMP purge

#====================================================================
# PRESSURE ADVANCE
#====================================================================

# It is recommended to calibrate your own pressure advance.
# See https://www.klipper3d.org/Pressure_Advance.html

#pressure_advance: .0465 # Overture PLA White
# pressure_advance: .0369 # Polymaker PLA Pro Teal
# pressure_advance_smooth_time: 0.04

#====================================================================
# BED
#====================================================================

[heater_bed]
heater_pin: PA2
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC4
#control: pid
#pid_Kp: 54.027
#pid_Ki: 0.770
#pid_Kd: 948.182
min_temp: 0
max_temp: 130


[bed_mesh]
horizontal_move_z: 2
speed: 200
mesh_min: 44.5, 10  # modify these according to the below guide. If the probe cannot reach then you will get a klipper error when trying to scan a bed mesh.
mesh_max: 220, 220 # modify these according to the below guide. If the probe cannot reach then you will get a klipper error when trying to scan a bed mesh.
probe_count: 25, 25
mesh_pps: 2, 2
algorithm: bicubic
fade_start: 1
fade_end: 10
fade_target: 0
adaptive_margin: 5
# #scan_overshoot: 8  # uncomment this section if you still have room left over on the X axis for some scan overshoot to product smoother movements and more accurate scanning. Uncommenting this should be fine if you are using a standard voron mount.


# #====================================================================
# # SAFE Z HOME
# #====================================================================

# [safe_z_home]
# home_xy_position: 147, 154
# speed: 75
# z_hop: 10
# z_hop_speed: 5
# move_to_previous: true

#====================================================================
# SCREW ADJUSTMENT
#====================================================================

[bed_screws]
screw1: 30, 204 # Using rear left to take measurements as harder to reach
screw1_name: rear left screw
screw2: 200, 204
screw2_name: rear right screw
screw3: 200, 33
screw3_name: front right screw
screw4: 30, 33
screw4_name: front left screw

[screws_tilt_adjust]
screw1: -5, 204
screw1_name: rear left screw
screw2: 135, 204
screw2_name: rear right screw
screw3: 135, 33
screw3_name: front right screw
screw4: -5, 33
screw4_name: front left screw
horizontal_move_z: 5
speed: 100
screw_thread: CW-M4 # Use CW for Clockwise and CCW for Counter Clockwise 

# #====================================================================
# # BED MESH PARAMETERS
# #====================================================================

# [bed_mesh]
# speed: 120
# horizontal_move_z: 8
# mesh_min: 15,15
# mesh_max: 188,186
# probe_count: 7,7
# algorithm: bicubic
# fade_start: 1
# fade_end: 10
# fade_target: 0

#====================================================================
# INPUT SHAPER
#====================================================================

# Klipper supports Input Shaping - a technique that can be used to
# reduce ringing (also known as echoing, ghosting or rippling) in
# prints. Ringing is a surface printing defect when, typically,
# elements like edges repeat themselves on a printed surface as a
# subtle 'echo':

# Every printer is different and the ringing frequency depends on
# the printer's mechanical properties. The ringing frequency can be
# measured by printing a simple test object and measuring the
# distance between the echoes. The ringing frequency is typically
# between 50 and 100 Hz.

# https://www.klipper3d.org/Resonance_Compensation.html

# Uncomment the following lines to enable input shaping. The
# shaper_freq_x and shaper_freq_y parameters should be set to the
# ringing frequency of the printer. 

# MANUAL SETUP
# [input_shaper]
# shaper_freq_x: 54.85
# shaper_type_x: ei
# shaper_freq_y: 57.52
# shaper_type_y: mzv

# ADXL345 SETUP
[input_shaper]
#shaper_freq_x: 74.400
#shaper_type_x: 2hump_ei
#shaper_freq_y: 0
#shaper_type_y: mzv

# Set up your accelerometer using the following link https://www.klipper3d.org/Measuring_Resonances.html

# # [mcu rpi]
# # serial: /tmp/klipper_host_mcu

# [adxl345]
# cs_pin: rpi:None

# [resonance_tester]
# accel_chip: adxl345
# probe_points:
#     117, 117, 20  # home probe point

